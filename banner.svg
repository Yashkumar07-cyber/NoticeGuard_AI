<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="35%" stop-color="#DB2777"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FFD93D"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="1050" cy="60" r="170" fill="#fff" opacity=".08"/>
    <circle cx="120" cy="300" r="140" fill="#fff" opacity=".08"/>
    <rect x="-400" width="400" height="320" fill="url(#shine)">
      <animate attributeName="x" from="-400" to="1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- paper + shield icon -->
  <g transform="translate(95,70)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="170" rx="14" fill="#fff"/>
    <rect x="18" y="24" width="94" height="10" rx="5" fill="#C4B5FD"/>
    <rect x="18" y="46" width="70" height="10" rx="5" fill="#F9A8D4"/>
    <rect x="18" y="68" width="82" height="10" rx="5" fill="#FFD93D"/>
    <path d="M65 92 L105 106 V134 C105 152 88 163 65 172 C42 163 25 152 25 134 V106 Z" fill="#6D28D9"/>
    <path d="M47 135 L61 149 L86 120" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff" filter="url(#shadow)">
    <text x="270" y="150" font-size="84" font-weight="800">NoticeGuard AI</text>
    <text x="274" y="200" font-size="30" font-weight="500" opacity=".95">Understand any official notice. Act with confidence.</text>
    <text x="274" y="248" font-size="22" opacity=".9">English + हिन्दी  •  Evidence-backed  •  Zero hallucinations</text>
  </g>
</svg>
